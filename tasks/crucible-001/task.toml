schema_version = "1.4"

# The only evidence used for grading: the action journal kept by the simulator
# sidecar. The agent's container has no access to this file.
artifacts = [
    { source = "/var/crucible/journal.jsonl", service = "sim" },
]

[task]
name = "crucible/crucible-001"
version = "1.0.0"
description = "Learn the behaviour of unknown substances in a budgeted lab, then complete one-shot chambers where every action is irreversible."
authors = []
keywords = ["rule-discovery", "experiment-design", "irreversible-planning", "simulation"]

[metadata]
difficulty = "hard"
category = "puzzle"
seed = 1

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024

[agent]
timeout_sec = 7200.0

[environment]
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"
cpus = 2
memory_mb = 4096
